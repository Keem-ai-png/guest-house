<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Payment result | KEEM Guesthouse</title><link rel="stylesheet" href="style.css"></head><body><main class="checkout-result"><p class="section-kicker">KEEM GUESTHOUSE</p><h1 id="resultTitle">Verifying your payment…</h1><p id="resultText">Please keep this page open while we confirm the transaction securely.</p><p id="reference"></p><a class="button" href="/#home">Return to website</a></main><script type="module">
const title=document.getElementById("resultTitle"),text=document.getElementById("resultText"),ref=document.getElementById("reference");
const reference=new URLSearchParams(location.search).get("reference");
if(!reference){title.textContent="Payment reference missing";text.textContent="We could not find a payment reference. Please contact the guesthouse before attempting another payment."; }
else{ref.textContent="Payment reference: "+reference;try{const r=await fetch("/api/paystack/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({reference})});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||"Payment verification failed.");title.textContent="Payment verified";text.textContent=d.status==="paid_conflict_review"?"Your payment was verified. The owner must review room availability and contact you to confirm the reservation.":"Your full payment was verified successfully. Your reservation is awaiting confirmation from the guesthouse owner."; }catch(e){title.textContent="We could not confirm the booking yet";text.textContent=e.message+" Please contact the guesthouse and provide the payment reference above. Do not pay again until the owner checks it.";}}
</script></body></html>
